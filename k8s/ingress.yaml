# [옵션] Ingress — 클러스터의 "Caddy 역할" (경로 기반 라우팅)
# port-forward만으로도 학습은 충분하므로 이 파일은 선택사항.
#
# 사용하려면 ingress-nginx 컨트롤러가 먼저 설치돼 있어야 한다:
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/cloud/deploy.yaml
# 이후: kubectl apply -f k8s/ingress.yaml → http://localhost 접속
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Caddy의 /api/* → backend 와 동일한 라우팅
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
