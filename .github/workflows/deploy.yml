name: CI/CD - Build Gate + Deploy

# main 브랜치에 push되면: ① 빌드 검사 통과 → ② 서버에 자동 배포
# 사용 전 준비 (자세한 내용은 DEPLOY.md 참고):
#   1) 서버가 비공개 리포를 인증 없이 pull 할 수 있게 설정 (Deploy Key 또는 PAT)
#   2) 이 리포의 Settings > Secrets 에 EC2_HOST / EC2_USER / EC2_SSH_KEY 등록
on:
  push:
    branches: [main]
    paths-ignore:        # 문서만 바뀐 push는 배포 안 함
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:   # Actions 탭에서 수동 실행도 가능

jobs:
  # ── ① 빌드 게이트: 깨지면 여기서 멈추고 배포 안 함 ─────────────
  build:
    name: Build Gate (빌드 검사)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Backend: Go 정적 분석 + 컴파일 (문법/타입 오류 시 실패) ---
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.mod
      - name: Backend build
        working-directory: backend
        run: |
          go vet ./...
          go build ./...
          echo "backend build OK"

      # --- Frontend: SvelteKit 빌드 (타입/문법 오류 시 실패) ---
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ── ② 배포: build 통과해야만 실행 ──────────────────────────────
  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 서버 secret이 아직 없으면 배포를 건너뛴다 (템플릿/초기 리포가 빨간불 안 나게)
      - name: Check deploy secrets
        id: check
        run: |
          if [ -n "${{ secrets.EC2_HOST }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::EC2_HOST secret 미설정 → 배포 스킵 (DEPLOY.md 참고해 secret 등록 시 자동 활성화)"
          fi
      - name: Deploy over SSH
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            # 서버에 ~/<리포이름> 으로 clone 되어 있다고 가정 (리포명 자동 사용)
            cd ~/${{ github.event.repository.name }}
            git pull origin main
            docker compose up -d --build
            docker image prune -f
